# ============ 企业多维数据管理系统 - Docker Compose ============
# 用法：
#   cp .env.example .env            # 必须修改 JWT/API Key 密钥，否则生产模式会启动失败（fail fast）
#   docker compose up -d --build
#   访问：http://localhost:8080     （Swagger: http://localhost:8080/api/docs）
#   初始化管理员：docker compose exec backend npm run create-admin
#
# 管理员密码不会写入代码或镜像，必须在容器内交互式创建。

services:
  mysql:
    image: mysql:8.4
    container_name: dms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dms_root_change_me}
      MYSQL_DATABASE: dms_dev
      MYSQL_USER: dms
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dms_password_change_me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-dms_root_change_me}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: ./backend
    container_name: dms-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # 默认使用本 compose 的 MySQL；如需连接公司已有 MySQL，改为外部地址即可
      DATABASE_URL: mysql://dms:${MYSQL_PASSWORD:-dms_password_change_me}@mysql:3306/dms_dev
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中配置 JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请在 .env 中配置 JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      API_KEY_SECRET: ${API_KEY_SECRET:?请在 .env 中配置 API_KEY_SECRET}
      BATCH_INSERT_LIMIT: ${BATCH_INSERT_LIMIT:-1000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 位于 Nginx 之后，需要信任 X-Forwarded-* 才能拿到真实客户端 IP
      TRUST_PROXY: "true"
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
    # 迁移在镜像入口脚本内执行（迁移完成后再 exec node，保证信号可直达）
    stop_grace_period: 30s

  nginx:
    # 前端在镜像构建阶段编译，产物直接进入 /usr/share/nginx/html
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: dms-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql-data:
